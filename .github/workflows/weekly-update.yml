name: Weekly Menu Update

on:
  schedule:
    # Weekday runs: morning + pre-lunch to catch mid-day menu changes.
    # CET (winter): UTC+1  |  CEST (summer): UTC+2
    # smart-update.js compares old vs new — no-op if nothing changed.
    - cron: '0 6 * * 1-5'   # Mon–Fri 08:00 CEST / 07:00 CET (morning)
    - cron: '0 9 * * 1-5'   # Mon–Fri 11:00 CEST / 10:00 CET (pre-lunch)

    # Weekend checker: every 6 hours on Saturday and Sunday.
    # Detects whether any canteen has released next week's menu early.
    - cron: '0 0,6,12,18 * * 6'  # Saturday
    - cron: '0 0,6,12,18 * * 0'  # Sunday
  workflow_dispatch: # Allow manual trigger

# Menu data + origin/description JSON live in the Supabase weekly_menus
# table now (smart-update.js upserts there). Workflow doesn't commit
# anything back to the repo, so least-privilege is read.
# `issues: write` is for the failure-notification step below.
permissions:
  contents: read
  issues: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run inside Playwright's official image: Chromium is pre-baked at
    # $PLAYWRIGHT_BROWSERS_PATH (/ms-playwright), so we never run the runtime
    # `playwright install` download+unzip that started hanging at 100% on the
    # hosted runners on 2026-05-29 and force-cancelled every run at the 45m
    # timeout. Tag MUST match the pinned playwright version in package.json
    # (1.58.2 -> browser build v1208) so the baked browser matches the library.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Force Node 24 for actions
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Install Node dependencies
        run: npm ci

      # No `playwright install` here — the browser is baked into the container
      # image. This step just asserts it's present (a fast no-op: "is already
      # installed") so we fail loud if the image ever drifts from the pinned
      # version, instead of falling through to a runtime download. The short
      # timeout is a backstop against that drift case re-introducing a hang.
      - name: Verify Playwright browser is present
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Smart update (scrape + compare + regenerate only changes)
        id: smart-update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node smart-update.js

      # Open (or update) a GitHub issue if the run failed, so we hear about it
      # before staff notice empty cards on Monday morning.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `weekly-update workflow failed`;
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Trigger: ${context.eventName}`,
              `Started: ${new Date().toISOString()}`,
              ``,
              `Check the run log; smart-update.js prints the failure reason on the line above the stack trace.`,
            ].join('\n');

            // Reuse an existing open issue with this title rather than spamming.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
              per_page: 50,
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['workflow-failure'],
              });
            }
