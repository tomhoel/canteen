name: Weekly Menu Update

on:
  schedule:
    # Weekday runs: morning + pre-lunch to catch mid-day menu changes.
    # CET (winter): UTC+1  |  CEST (summer): UTC+2
    # smart-update.js compares old vs new — no-op if nothing changed.
    - cron: '0 6 * * 1-5'   # Mon–Fri 08:00 CEST / 07:00 CET (morning)
    - cron: '0 9 * * 1-5'   # Mon–Fri 11:00 CEST / 10:00 CET (pre-lunch)

    # Weekend checker: every 6 hours on Saturday and Sunday.
    # Detects whether any canteen has released next week's menu early.
    - cron: '0 0,6,12,18 * * 6'  # Saturday
    - cron: '0 0,6,12,18 * * 0'  # Sunday
  workflow_dispatch: # Allow manual trigger

# Menu data + origin/description JSON live in the Supabase weekly_menus
# table now (smart-update.js upserts there). Workflow doesn't commit
# anything back to the repo, so least-privilege is read.
# `issues: write` is for the failure-notification step below.
permissions:
  contents: read
  issues: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Force Node 24 for actions
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Install Node dependencies
        run: npm ci

      # Bound each attempt with a hard timeout + retry. Since 2026-05-29 the
      # install started stalling at 100% download (CDN fetch of a follow-up
      # artifact hangs with no client-side timeout), burning the full 45m job
      # budget and getting force-cancelled — silently, since a cancel doesn't
      # fire the failure step below. timeout+retry recovers transient stalls
      # and, if genuinely broken, fails fast (≤~15m) so we actually get alerted.
      - name: Install Playwright browsers
        timeout-minutes: 18
        run: |
          for attempt in 1 2 3; do
            echo "::group::playwright install (attempt $attempt)"
            if timeout -k 30s 300s npx playwright install chromium --with-deps; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "playwright install attempt $attempt stalled/failed; retrying..."
          done
          echo "playwright install failed after 3 attempts"
          exit 1

      - name: Smart update (scrape + compare + regenerate only changes)
        id: smart-update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node smart-update.js

      # Open (or update) a GitHub issue if the run failed, so we hear about it
      # before staff notice empty cards on Monday morning.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `weekly-update workflow failed`;
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Trigger: ${context.eventName}`,
              `Started: ${new Date().toISOString()}`,
              ``,
              `Check the run log; smart-update.js prints the failure reason on the line above the stack trace.`,
            ].join('\n');

            // Reuse an existing open issue with this title rather than spamming.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
              per_page: 50,
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['workflow-failure'],
              });
            }
