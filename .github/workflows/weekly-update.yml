name: Weekly Menu Update

on:
  schedule:
    # Weekday main runs: 08:00 Oslo time
    # CET (winter): UTC+1 → 07:00 UTC  |  CEST (summer): UTC+2 → 06:00 UTC
    # Using 06:00 UTC to target 08:00 CEST (summer). In winter this fires at 07:00.
    - cron: '0 6 * * 1'  # Monday   08:00 CEST / 07:00 CET
    - cron: '0 6 * * 2'  # Tuesday  08:00 CEST / 07:00 CET

    # Weekend checker: every 6 hours on Saturday and Sunday.
    # Detects whether any canteen has released next week's menu early.
    # smart-update.js checks each canteen individually — only canteens whose
    # week number has changed get new images generated. If nothing has changed
    # the scrape is a no-op and no commit is made.
    - cron: '0 0,6,12,18 * * 6'  # Saturday 00:00 / 06:00 / 12:00 / 18:00 UTC
    - cron: '0 0,6,12,18 * * 0'  # Sunday   00:00 / 06:00 / 12:00 / 18:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Smart update (scrape + compare + regenerate only changes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node smart-update.js

      - name: Commit and push updated menu & images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/menu.json public/images/ public/images_nobg/ public/dish-origins.json public/dish-descriptions.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update weekly menu and food images $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
