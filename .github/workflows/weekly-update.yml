name: Weekly Menu Update

on:
  schedule:
    # Weekday runs: morning + pre-lunch to catch mid-day menu changes.
    # CET (winter): UTC+1  |  CEST (summer): UTC+2
    # smart-update.js compares old vs new — no-op if nothing changed.
    - cron: '0 6 * * 1-5'   # Mon–Fri 08:00 CEST / 07:00 CET (morning)
    - cron: '0 9 * * 1-5'   # Mon–Fri 11:00 CEST / 10:00 CET (pre-lunch)

    # Weekend checker: every 6 hours on Saturday and Sunday.
    # Detects whether any canteen has released next week's menu early.
    - cron: '0 0,6,12,18 * * 6'  # Saturday
    - cron: '0 0,6,12,18 * * 0'  # Sunday
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Force Node 24 for actions
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Smart update (scrape + compare + regenerate only changes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node smart-update.js

      - name: Commit and push updated menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/menu.json public/dish-origins.json public/dish-descriptions.json
          # Note: images are now stored in Supabase and ignored by Git
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update weekly menu and food images $(date +%Y-%m-%d)"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi
