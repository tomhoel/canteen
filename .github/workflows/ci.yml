name: CI

# Runs on every pull request and on everything that lands on main.
#
# This is deliberately NOT a scheduled workflow. GitHub disables scheduled
# workflows after 60 days without repository activity, which is why the weekly
# updater lives in Vercel Cron (api/cron/update.ts) instead — see the comment
# there. A push/pull_request trigger has no such rule: it only ever runs when
# there is something to check.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch supersedes the first; don't burn minutes
# checking a commit nobody will merge. main is never cancelled, so the history
# of what passed stays complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime Vercel gives the functions in api/.
          node-version: 24
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the two files disagree. That alone
      # would have caught @vercel/node being a declared devDependency that was
      # never actually installed, which left `npm run typecheck` broken locally
      # for weeks without anything noticing.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The repo is at zero warnings, so treat a new one as a failure. Without
      # this, `npm run lint` only fails on errors and warnings accumulate until
      # nobody reads the output — which is exactly how the previous 14 got
      # there. If a warning is genuinely the right answer, an
      # `eslint-disable-next-line` with a comment saying why is the way to say
      # so, and the comment is the part that has value.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Separate job on purpose. It needs a 100 MB browser download and takes about
  # a minute longer than everything above put together, and the fast checks are
  # the ones people wait on. Splitting them also means a browser flake reads as
  # "e2e failed" rather than poisoning typecheck/lint/test.
  e2e:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Only chromium, and only its own dependencies. The suite asserts layout,
      # animation counts and bundle size — none of which differ by engine — so
      # a second browser would double the runtime to re-check the same numbers.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app itself before serving it, so there
      # is no separate build step here.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
