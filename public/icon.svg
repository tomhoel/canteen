<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Plate -->
  <circle cx="50" cy="50" r="45" fill="url(#plateGradient)"/>
  <circle cx="50" cy="50" r="35" fill="#FFFBF5"/>
  
  <!-- Fork -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="3" height="30" fill="#FF9500" rx="1.5"/>
    <rect x="6" y="0" width="3" height="30" fill="#FF9500" rx="1.5"/>
    <rect x="12" y="0" width="3" height="30" fill="#FF9500" rx="1.5"/>
    <rect x="0" y="0" width="15" height="8" fill="#FF9500" rx="2"/>
  </g>
  
  <!-- Knife -->
  <g transform="translate(57, 35)">
    <rect x="0" y="0" width="4" height="30" fill="#FFB800" rx="2"/>
    <path d="M 0 0 L 4 0 L 2 -8 Z" fill="#FFB800"/>
  </g>
</svg>
