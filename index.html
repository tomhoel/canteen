<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Tints the iOS status bar and Safari's chrome even before install. -->
    <meta name="theme-color" content="#f5f0e8" />
    <!-- Must stay identical to the title in src/routes/__root.tsx, which
         replaces it on mount; a different string here renames the tab a
         moment after the page opens. -->
    <title>🍽️ Dagens Lunsj | Telenor Fornebu</title>

    <!-- The app's own background, inline, so the very first paint is already
         the right colour. globals.css sets this too, but it is an 83 KB
         render-blocking file: until it lands the page would otherwise be white,
         which on a cold launch is a visible flash of the wrong colour. -->
    <style>
      html, body { background: #f5f0e8; margin: 0; }

      /* The shell below is markup with no stylesheet of its own, so it must
         never be painted before globals.css has landed — unstyled, it is a
         browser-default heading, a row of bare buttons and a strip of text.

         The release build blocks rendering on the stylesheet, so there this
         costs nothing: both rules are in the first CSSOM and the shell paints
         styled on the first frame. The dev server is the case that needs it —
         Vite serves CSS through JS there, with no <link> at all, so without
         this the shell is guaranteed to flash bare on every reload.

         The reveal deliberately lives in globals.css rather than in a script:
         it makes "visible" and "styled" the same condition, so this cannot
         come apart again. */
      #root { visibility: hidden; }

      /* Outfit, self-hosted. This used to be a Google Fonts <link>, which cost
         a second cross-origin connection (fonts.googleapis.com for the CSS,
         then fonts.gstatic.com for the file itself) on top of every other
         request the cold-launch critical path already makes. Google serves
         this typeface as two variable-weight files split by unicode range
         (latin, latin-ext); declaring the same two @font-face rules — same
         bytes, `font-weight: 100 900` covering the whole variable axis in one
         face instead of Google's seven discrete-weight duplicates of the same
         file — but pointing at /fonts instead removes that whole round trip:
         the file now shares its origin, TLS session and HTTP connection with
         the document itself. `display=swap` is kept for the same reason it
         was set before: text stays visible in the fallback face for the (now
         shorter) time until the real one loads. */
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/outfit-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/outfit-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!-- The Norwegian/English UI text this app renders is entirely within the
         "latin" subset above (no Cyrillic, Greek, etc. glyphs are needed), so
         only that file is worth blocking on. `preload` starts the fetch the
         instant the HTML is parsed, in parallel with the JS bundle, instead of
         waiting for the CSSOM (and therefore this very <style>) to be built
         first the way a plain @font-face reference would. -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Preconnect to Supabase Storage for both credentials and image requests -->
    <link rel="preconnect" href="https://sloutnqpqfesyoycklgd.supabase.co" />
    <link rel="preconnect" href="https://sloutnqpqfesyoycklgd.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://sloutnqpqfesyoycklgd.supabase.co" />

    <!-- Starts the menu request in parallel with the JS bundle, so the app has
         its data before React has finished booting. api-client picks the result
         up off window.__INITIAL_MENU_DATA__ / __MENU_FETCH_PROMISE__.

         No `crossorigin` on the preload: this is a same-origin URL, and the
         attribute would put the link in CORS mode with credentials omitted
         while the `fetch()` below runs in the default same-origin credentials
         mode. The two would not match, the preload would go unused, and every
         cold load would pay for the response twice. -->
    <link rel="preload" href="/api/menu" as="fetch" />
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);

          // A ?week= load ignores all of this: api-client only consults the
          // eager fetch when no week is pinned, and the plates below belong to
          // the current week, not the requested one. Firing it there buys a
          // wasted round trip and three preloads of the wrong pictures.
          if (params.get("week")) return;

          var DAY_KEYS = ["monday", "tuesday", "wednesday", "thursday", "friday"];

          // Which day's plate is the LCP image.
          //
          // Resolved in Europe/Oslo rather than from the device clock, because
          // that is where the rest of the app resolves "today" (dateUtils'
          // todayOsloParts). A phone an hour the other side of midnight would
          // otherwise warm yesterday's or tomorrow's picture and leave the real
          // one to load cold.
          function daysToWarm() {
            var pinned = (params.get("day") || "").toLowerCase();
            if (DAY_KEYS.indexOf(pinned) >= 0) return [pinned];

            var short = null;
            try {
              short = new Intl.DateTimeFormat("en-US", {
                timeZone: "Europe/Oslo",
                weekday: "short",
              }).format(new Date());
            } catch (e) {}

            var index = ["Mon", "Tue", "Wed", "Thu", "Fri"].indexOf(short);
            if (index >= 0) return [DAY_KEYS[index]];

            // Weekend. The app lands on next week's Monday when the kitchens
            // have published ahead and on the Friday just gone when they have
            // not, and which one it is depends on menu data this script has not
            // received yet. Warm both — one of the two is the LCP image, and the
            // other is a single cached picture.
            return ["monday", "friday"];
          }

          window.__MENU_FETCH_PROMISE__ = fetch("/api/menu")
            .then(function (res) {
              return res.ok ? res.json() : null;
            })
            .then(function (data) {
              if (!data || !data.menuData) return data;
              window.__INITIAL_MENU_DATA__ = data;

              if (data.plateImages) {
                var canteens = ["Eat the street", "Fresh4you", "Flow"];
                var days = daysToWarm();
                var first = true;
                for (var d = 0; d < days.length; d++) {
                  for (var i = 0; i < canteens.length; i++) {
                    var plate = data.plateImages[days[d] + "|" + canteens[i]];
                    if (!plate) continue;
                    var enc = plate.split("/").map(encodeURIComponent).join("/");
                    var link = document.createElement("link");
                    link.rel = "preload";
                    link.as = "image";
                    link.href =
                      "https://sloutnqpqfesyoycklgd.supabase.co/storage/v1/render/image/public/images_nobg/" +
                      enc +
                      "?width=340&format=webp&quality=75&resize=contain";
                    if (first) {
                      link.fetchPriority = "high";
                      first = false;
                    }
                    document.head.appendChild(link);
                  }
                }
              }
              return data;
            })
            .catch(function () {
              return null;
            });
        } catch (e) {}
      })();
    </script>

    <!-- public/manifest.json and the icons beside it already existed but were
         never linked, so the app could not be installed from any browser. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS ignores the manifest for launch chrome and reads these instead, so
         both have to ship. The icon must be opaque: iOS fills any transparency
         with a colour we don't choose. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dagens Lunsj" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Deliberately no apple-touch-startup-image. iOS shows a launch image only
         on an exact device-size media match and has no fallback, so a partial
         matrix gives unlisted iPhones a blank white launch instead of the plain
         one they get now. Adding it means generating the full device set. -->
  </head>
  <body>
    <!--
      The app's own shell, painted before a single byte of JavaScript runs.

      Every class below is one React renders too, and the tree mirrors
      LoadingScreen node for node — because the whole point is that React's
      first commit changes nothing on screen. That is a promise this file
      cannot keep on its own: it is hand-written HTML that has to track a
      component it cannot import. It has drifted before. The header block used
      to use `header-top` / `header-title-row` / `header-title` / `date-row` /
      `date-text`, none of which had survived a redesign to `hero-inline`, so
      the shell rendered as two lines of unstyled browser-default text — a
      32px serif "Dagens Lunsj" over a run-together "Fredag Telenor Fornebu" —
      for the entire window between first paint and mount.

      `index.static-shell.test.ts` is what keeps that from happening again: it
      fails if any class used here has no rule in the stylesheets.

      No text that depends on the date appears here. The weekday, the week
      number and the dates in the strip all come from computeDisplayContext,
      and a second, vanilla copy of that logic living in this file is exactly
      what that function exists to prevent. The boxes are sized correctly and
      their text arrives with the first commit.
    -->
    <div id="root">
      <div class="animated-gradient-root" aria-hidden="true">
        <div class="animated-gradient-blob blob-1" style="background: #f0d090"></div>
        <div class="animated-gradient-blob blob-2" style="background: #d4a090"></div>
        <div class="animated-gradient-blob blob-3" style="background: #f0bfa0"></div>
        <div class="animated-gradient-blob blob-4" style="background: #e8d8c4"></div>
      </div>
      <div class="app-wrapper">
        <header class="app-header">
          <div class="hero-inline">
            <h1 class="hero-title">Dagens <span>Lunsj</span></h1>
            <p class="hero-subtitle">&nbsp;</p>
          </div>
          <div class="header-actions">
            <button class="info-btn" disabled title="Om appen" aria-label="Om appen"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
            <button class="info-btn" disabled title="Kantineseiere" aria-label="Kantineseiere"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2"/><path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2"/><path d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3"/><path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3"/></svg></button>
            <button class="info-btn" disabled title="Ukeoversikt" aria-label="Ukeoversikt"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg></button>
          </div>
        </header>
        <main class="cards-container" role="status" aria-busy="true" aria-label="Laster menyer">
          <div class="cards-track">
            <div class="cards-animated-wrapper">
            <div class="food-card-3d-wrapper">
              <article class="food-card skeleton-card" style="animation-delay: 0ms" aria-hidden="true">
                <div class="card-image-wrapper"><div class="card-image-circle"><div class="image-shimmer"></div></div></div>
                <div class="card-content">
                  <div class="card-header">
                    <div class="canteen-name"><span class="skeleton-line skeleton-line-canteen"></span></div>
                    <h3 class="dish-name"><span class="skeleton-line skeleton-line-dish"></span></h3>
                  </div>
                  <div class="dish-meta-row"><div class="allergens-row"><span class="skeleton-line skeleton-line-chip"></span><span class="skeleton-line skeleton-line-chip"></span></div></div>
                </div>
                <div class="card-bottom">
                  <div class="side-dishes-header"><span class="side-dishes-title"><span class="skeleton-line skeleton-line-label"></span></span></div>
                  <div class="side-dish-list">
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side"></span></div>
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side skeleton-line-side-short"></span></div>
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side"></span></div>
                  </div>
                </div>
              </article>
            </div>
            <div class="food-card-3d-wrapper">
              <article class="food-card skeleton-card" style="animation-delay: 75ms" aria-hidden="true">
                <div class="card-image-wrapper"><div class="card-image-circle"><div class="image-shimmer"></div></div></div>
                <div class="card-content">
                  <div class="card-header">
                    <div class="canteen-name"><span class="skeleton-line skeleton-line-canteen"></span></div>
                    <h3 class="dish-name"><span class="skeleton-line skeleton-line-dish"></span></h3>
                  </div>
                  <div class="dish-meta-row"><div class="allergens-row"><span class="skeleton-line skeleton-line-chip"></span><span class="skeleton-line skeleton-line-chip"></span></div></div>
                </div>
                <div class="card-bottom">
                  <div class="side-dishes-header"><span class="side-dishes-title"><span class="skeleton-line skeleton-line-label"></span></span></div>
                  <div class="side-dish-list">
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side"></span></div>
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side skeleton-line-side-short"></span></div>
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side"></span></div>
                  </div>
                </div>
              </article>
            </div>
            <div class="food-card-3d-wrapper">
              <article class="food-card skeleton-card" style="animation-delay: 150ms" aria-hidden="true">
                <div class="card-image-wrapper"><div class="card-image-circle"><div class="image-shimmer"></div></div></div>
                <div class="card-content">
                  <div class="card-header">
                    <div class="canteen-name"><span class="skeleton-line skeleton-line-canteen"></span></div>
                    <h3 class="dish-name"><span class="skeleton-line skeleton-line-dish"></span></h3>
                  </div>
                  <div class="dish-meta-row"><div class="allergens-row"><span class="skeleton-line skeleton-line-chip"></span><span class="skeleton-line skeleton-line-chip"></span></div></div>
                </div>
                <div class="card-bottom">
                  <div class="side-dishes-header"><span class="side-dishes-title"><span class="skeleton-line skeleton-line-label"></span></span></div>
                  <div class="side-dish-list">
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side"></span></div>
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side skeleton-line-side-short"></span></div>
                    <div class="side-dish-item"><span class="skeleton-line skeleton-line-side"></span></div>
                  </div>
                </div>
              </article>
            </div>
            </div>
          </div>
        </main>
        <nav class="day-bar day-bar-weekday-current day-bar-unmeasured" aria-label="Velg dag">
          <div class="day-selector" role="tablist">
            <button role="tab" class="day-btn" aria-selected="false" disabled><span class="day-label-name">Mandag</span><span class="day-label-date">&nbsp;</span></button>
            <button role="tab" class="day-btn" aria-selected="false" disabled><span class="day-label-name">Tirsdag</span><span class="day-label-date">&nbsp;</span></button>
            <button role="tab" class="day-btn" aria-selected="false" disabled><span class="day-label-name">Onsdag</span><span class="day-label-date">&nbsp;</span></button>
            <button role="tab" class="day-btn" aria-selected="false" disabled><span class="day-label-name">Torsdag</span><span class="day-label-date">&nbsp;</span></button>
            <button role="tab" class="day-btn" aria-selected="false" disabled><span class="day-label-name">Fredag</span><span class="day-label-date">&nbsp;</span></button>
          </div>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
