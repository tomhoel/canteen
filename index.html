<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Tints the iOS status bar and Safari's chrome even before install. -->
    <meta name="theme-color" content="#f5f0e8" />
    <title>Canteen — Menus, Deals & Culinary Discovery</title>

    <!-- The app's own background, inline, so the very first paint is already
         the right colour. globals.css sets this too, but it is an 83 KB
         render-blocking file: until it lands the page would otherwise be white,
         which on a cold launch is a visible flash of the wrong colour. -->
    <style>
      html, body { background: #f5f0e8; margin: 0; }

      /* Outfit, self-hosted. This used to be a Google Fonts <link>, which cost
         a second cross-origin connection (fonts.googleapis.com for the CSS,
         then fonts.gstatic.com for the file itself) on top of every other
         request the cold-launch critical path already makes. Google serves
         this typeface as two variable-weight files split by unicode range
         (latin, latin-ext); declaring the same two @font-face rules — same
         bytes, `font-weight: 100 900` covering the whole variable axis in one
         face instead of Google's seven discrete-weight duplicates of the same
         file — but pointing at /fonts instead removes that whole round trip:
         the file now shares its origin, TLS session and HTTP connection with
         the document itself. `display=swap` is kept for the same reason it
         was set before: text stays visible in the fallback face for the (now
         shorter) time until the real one loads. */
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/outfit-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/outfit-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!-- The Norwegian/English UI text this app renders is entirely within the
         "latin" subset above (no Cyrillic, Greek, etc. glyphs are needed), so
         only that file is worth blocking on. `preload` starts the fetch the
         instant the HTML is parsed, in parallel with the JS bundle, instead of
         waiting for the CSSOM (and therefore this very <style>) to be built
         first the way a plain @font-face reference would. -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://sloutnqpqfesyoycklgd.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://sloutnqpqfesyoycklgd.supabase.co" />

    <!-- public/manifest.json and the icons beside it already existed but were
         never linked, so the app could not be installed from any browser. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS ignores the manifest for launch chrome and reads these instead, so
         both have to ship. The icon must be opaque: iOS fills any transparency
         with a colour we don't choose. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dagens Lunsj" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Deliberately no apple-touch-startup-image. iOS shows a launch image only
         on an exact device-size media match and has no fallback, so a partial
         matrix gives unlisted iPhones a blank white launch instead of the plain
         one they get now. Adding it means generating the full device set. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
